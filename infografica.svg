<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" role="img" aria-label="Infografica: valenza delle parole e degli atomi, autori Merola Giovanni e Palmira Di Marco">
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}.h{font-size:32px;font-weight:800}.sub{font-size:20px}.box{fill:white;stroke:#d6e2ef;stroke-width:2}.b{font-size:23px;font-weight:700}.small{font-size:17px}.atom{stroke:#516a85;stroke-width:2}.bond{stroke:#617c93;stroke-width:5;stroke-linecap:round}</style></defs>
<rect width="1280" height="840" fill="#f3f7fc"/>
<rect width="1280" height="115" fill="#183453"/>
<text x="42" y="52" style="font-size:42px;fill:white;font-weight:800">LEGAMI &amp; PAROLE</text><text x="44" y="88" style="font-size:22px;fill:#d4e9ff">Valenza chimica e grammatica valenziale: analogie e limiti</text>
<rect class="box" x="32" y="140" width="595" height="265" rx="21"/><rect x="32" y="140" width="595" height="58" rx="21" fill="#d7eafa"/><text class="b" x="56" y="177">CHIMICA: legami tra atomi</text>
<text class="small" x="56" y="232">Nel modello introduttivo, un atomo forma un numero</text><text class="small" x="56" y="258">caratteristico di legami. La valenza dipende dal contesto.</text>
<g transform="translate(60 285)"><circle cx="26" cy="26" r="21" fill="#e5edf4" class="atom"/><text x="20" y="33" font-size="20" font-weight="bold">H</text><line class="bond" x1="49" y1="26" x2="102" y2="26"/><circle cx="129" cy="26" r="27" fill="#d95154" class="atom"/><text x="121" y="34" font-size="23" fill="white">O</text><line class="bond" x1="157" y1="26" x2="205" y2="26"/><circle cx="229" cy="26" r="21" fill="#e5edf4" class="atom"/><text x="223" y="33" font-size="20">H</text><text x="272" y="21" font-size="25" font-weight="bold">H₂O</text><text x="272" y="47" font-size="18">O: valenza 2</text></g>
<rect class="box" x="653" y="140" width="595" height="265" rx="21"/><rect x="653" y="140" width="595" height="58" rx="21" fill="#eadcf8"/><text class="b" x="677" y="177">ITALIANO: verbo e argomenti</text>
<text class="small" x="677" y="232">La valenza del verbo è il numero di argomenti</text><text class="small" x="677" y="258">necessari al nucleo della frase, nell'accezione scelta.</text>
<rect x="812" y="285" width="150" height="49" rx="24" fill="#794cab"/><text x="845" y="316" font-size="23" font-weight="bold" fill="white">osserva</text><path d="M812 309 L758 343 M962 309 L1010 343" fill="none" stroke="#855bb0" stroke-width="3"/><rect x="660" y="343" width="190" height="38" rx="19" fill="#f1e9fb"/><text x="673" y="368" font-size="18">La docente</text><rect x="958" y="343" width="206" height="38" rx="19" fill="#f1e9fb"/><text x="980" y="368" font-size="18">il becher</text>
<rect class="box" x="32" y="430" width="386" height="272" rx="20"/><rect x="32" y="430" width="386" height="59" rx="20" fill="#e4f6eb"/><text class="b" x="55" y="468">1 · Confronto utile</text><text class="small" x="55" y="522">Legami semplici e argomenti:</text><text class="small" x="55" y="551">H–Cl → 1 / verbo monovalente</text><text class="small" x="55" y="580">H–O–H → 2 / verbo bivalente</text><text class="small" x="55" y="609">NH₃ → 3 / verbo trivalente</text><text x="55" y="655" font-size="17" fill="#27694a">Il confronto è solo un'analogia.</text>
<rect class="box" x="447" y="430" width="386" height="272" rx="20"/><rect x="447" y="430" width="386" height="59" rx="20" fill="#fff0cf"/><text class="b" x="468" y="468">2 · Confronto limitato</text><text class="small" x="468" y="522">H₂ e Cl₂: la valenza è 1,</text><text class="small" x="468" y="551">ma non c'è un atomo centrale</text><text class="small" x="468" y="580">equivalente al verbo.</text><text class="small" x="468" y="624">Modello corretto, analogia</text><text class="small" x="468" y="652">strutturale soltanto parziale.</text>
<rect class="box" x="862" y="430" width="386" height="272" rx="20"/><rect x="862" y="430" width="386" height="59" rx="20" fill="#fde3e4"/><text class="b" x="884" y="468">3 · Analogia interrotta</text><text class="small" x="884" y="520">CO₂: O=C=O</text><text class="small" x="884" y="552">C: valenza 4, due O vicini.</text><text class="small" x="884" y="584">N₂: N≡N, valenza 3, un vicino.</text><text class="small" x="884" y="623">Il legame multiplo non ha un</text><text class="small" x="884" y="650">equivalente tra gli argomenti.</text>
<rect x="32" y="724" width="1216" height="91" rx="18" fill="#233a62"/>
<text x="55" y="762" font-size="23" font-weight="700" fill="white">Autori: Merola Giovanni e Palmira Di Marco · ITIS S. Cannizzaro, Colleferro (RM)</text>
<text x="55" y="790" font-size="18" fill="#d4e3f9">Materiale progettato e sviluppato con il supporto dell'intelligenza artificiale generativa.</text>
</svg>